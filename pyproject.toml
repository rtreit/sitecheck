[project]
name = "sitecheck"
version = "0.1.0"
description = "A forensics tool for checking whether sites deployed in Azure are properly secured"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40.0",
    "aiofiles>=23.2.1",
    "openai>=1.44.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.4.2",
    "tabulate>=0.9.0",
    "pandas>=2.3.3",
]

[project.scripts]
sitecheck = "sitecheck.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
