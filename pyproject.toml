[project]
name = "sitecheck"
version = "0.1.0"
description = "A forensics tool for checking whether sites deployed in Azure are properly secured"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40.0",
    "anthropic>=0.18.0",
    "aiofiles>=23.2.1",
]

[project.scripts]
sitecheck = "sitecheck.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
